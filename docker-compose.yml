services:
  postgres:
    image: postgres:16-alpine
    container_name: agritrace-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agritrace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-dev-only}
      POSTGRES_DB: ${POSTGRES_DB:-agritrace}
    ports:
      - "5432:5432"
    volumes:
      - agritrace_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agritrace} -d ${POSTGRES_DB:-agritrace}"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  agritrace_pgdata:
